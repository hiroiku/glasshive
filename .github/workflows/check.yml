name: check

on:
  push:
    branches: [main]
  pull_request:

# 読み取り専用のツールなので、CI にも読む以上の権限を渡さない
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # **ビルドが先。** ルートの一覧(routeTree.gen.ts)はビルドが生成するもので、
      # git には入れていない。順を入れ替えると、まっさらな checkout でだけ型が落ちる
      - run: npm run build
      # 書式・層の依存の向き・8 構成の型・テスト
      - run: npm run check
      # ビルドしたパッケージを外から叩く。ここだけが実際に配布するものを検証する
      - run: npm run test:smoke
